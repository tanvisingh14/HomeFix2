<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Worker Profile - HomeFix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head>
<body>
<header><h1>HomeFix</h1><nav><a href="index.html">Home</a><a href="workers.html">Workers</a><a href="index.html#contact">Contact</a></nav></header>
<section class="profile-section"><div class="profile-box" id="box"></div></section>
<footer><p>&copy; 2026 HomeFix. All rights reserved.</p></footer>
<script src="workers.js"></script>
<script>
const w=WORKERS.find(x=>x.id===+new URLSearchParams(location.search).get('id'));
const box=document.getElementById('box');
if(!w){ document.title='Worker not found - HomeFix'; box.innerHTML='<h2>Worker not found</h2><p class="profile-role">This profile does not exist.</p><a class="book-btn" href="workers.html">Browse workers</a>'; }
else {
 document.title=w.name+' - HomeFix';
 const today=new Date().toISOString().split('T')[0];
 box.innerHTML=`
 <div class="profile-top"><div class="profile-avatar">${initials(w.name)}</div><div><h2>${w.name}</h2>
  <p class="profile-role">${SERVICES[w.service]} &middot; ${w.years} years experience &middot; ₹${w.rate}/visit</p>
  <p class="profile-rating">${stars(w.rating)} <span>${w.rating} (${w.jobs} completed jobs)</span></p></div></div>
 <div class="profile-details"><h3>Skills</h3><div class="skill-tags">${w.skills.map(s=>`<span>${s}</span>`).join('')}</div>
  <h3>About</h3><p>${w.about}</p><h3>Availability</h3>
  <p class="${w.available?'availability':'availability off'}">${w.available?'Available Today':'Busy Today - book a later date'}</p></div>
 <form class="book-form" id="bookForm"><h3>Book ${w.name.split(' ')[0]}</h3>
  <div class="form-row"><label>Your name<input name="name" required></label><label>Phone<input name="phone" type="tel" pattern="[0-9]{10}" placeholder="10-digit number" required></label></div>
  <div class="form-row"><label>Date<input name="date" type="date" min="${today}" required></label><label>Time<select name="time"><option>Morning (9-12)</option><option>Afternoon (12-4)</option><option>Evening (4-7)</option></select></label></div>
  <label>Address<input name="address" required></label>
  <label>Describe the problem<textarea name="note" rows="3"></textarea></label>
  <button class="book-btn" type="submit">Confirm Booking</button><p class="form-status" id="bookStatus" role="status"></p></form>`;
 document.getElementById('bookForm').addEventListener('submit',e=>{
  e.preventDefault(); const d=Object.fromEntries(new FormData(e.target));
  try{ const all=JSON.parse(localStorage.getItem('homefix_bookings')||'[]'); all.push({...d,workerId:w.id,worker:w.name,status:'Pending',created:new Date().toISOString()}); localStorage.setItem('homefix_bookings',JSON.stringify(all)); }catch(_){}
  document.getElementById('bookStatus').textContent=`Booking request sent to ${w.name} for ${d.date} (${d.time}). Status: Pending.`; e.target.reset();
 });
}
</script></body></html>
